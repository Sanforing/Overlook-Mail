<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Overlook Mail</title>
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
  <link rel="manifest" href="/favicon/site.webmanifest">
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://unpkg.com/split.js/dist/split.min.js"></script>
  <!-- Google AdSense — publisher script loaded once, ad units pushed individually -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1240411576907738"
    crossorigin="anonymous"></script>
</head>
<body>
  <div id="app" class="app-shell" aria-busy="true">
    <header id="topbar" class="topbar"></header>
    <main class="workspace">
      <aside id="sidebar" class="pane sidebar"></aside>
      <section id="list" class="pane list"></section>
      <section id="reader" class="pane reader"></section>
    </main>
    <div id="fake-loader" class="fake-loader hidden" role="status" aria-live="polite"></div>
    <div id="modal-root"></div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
